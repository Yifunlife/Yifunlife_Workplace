name: Build Android Agent
on:
  push:
    branches: [main]
    paths: ['android-agent/**', 'android_fleet.py', 'scripts/test_android_fleet.py', '.github/workflows/android-agent.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Restore application source
        run: python3 prepare_source.py
      - name: Verify Android enrollment and credentials
        run: python3 scripts/test_android_fleet.py
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build and lint Android agent
        working-directory: android-agent
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: yifun-android-agent-debug
          path: android-agent/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
