name: Build Workplace container
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build image
        run: docker build -t registry.cloudflare.com/5a472d15dc37681abce4ab6e4eb152c3/yifunlife-workplace:${{ github.sha }} .
      - name: Verify container startup
        run: |
          docker run -d --name smoke -e YIFUN_DATABASE_BACKEND=sqlite -e YIFUN_AUTH_MODE=password -e YIFUN_DATA_ROOT=/tmp/workplace-runtime registry.cloudflare.com/5a472d15dc37681abce4ab6e4eb152c3/yifunlife-workplace:${{ github.sha }}
          sleep 35
          docker logs smoke
          docker cp smoke:/tmp/workplace-runtime/logs /tmp/workplace-smoke-logs || true
          tail -n 35 /tmp/workplace-smoke-logs/*.log || true
          docker inspect smoke --format '{{.State.Status}} {{.State.ExitCode}}'
      - name: Push image
        env:
          REGISTRY_PASSWORD: ${{ secrets.CF_REGISTRY_PASSWORD }}
        run: |
          printf '%s' "$REGISTRY_PASSWORD" | docker login registry.cloudflare.com -u v1 --password-stdin
          docker push registry.cloudflare.com/5a472d15dc37681abce4ab6e4eb152c3/yifunlife-workplace:${{ github.sha }}
      - name: Clear registry login
        if: always()
        run: docker logout registry.cloudflare.com
